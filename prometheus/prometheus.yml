# ========================================================
# PROMETHEUS CONFIGURATION
# Môn: Triển khai và Quản trị Hệ thống Phần mềm - Đề tài 13
# ========================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "rules.yml"

scrape_configs:
  # 1. Web Application Metrics (Node.js Express + prom-client)
  - job_name: "portfolio-web"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["portfolio-web:3000"]
        labels:
          environment: "production"
          service: "web-app"

  # 2. Container Performance Metrics (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "production"
          service: "containers"

  # 3. Database Metrics (mysqld-exporter)
  - job_name: "mysqld-exporter"
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          environment: "production"
          service: "database"

  # 4. Nginx Reverse Proxy Metrics (nginx-prometheus-exporter)
  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          environment: "production"
          service: "proxy"

  # 5. Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
