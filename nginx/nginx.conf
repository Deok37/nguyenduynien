# ========================================================
# NGINX REVERSE PROXY & HARDENED SECURITY CONFIGURATION
# Môn: Triển khai và Quản trị Hệ thống Phần mềm - Đề tài 13
# ========================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ========================================================
    # LOGGING CONFIGURATION (Format JSON for Loki / Promtail)
    # ========================================================
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ========================================================
    # HARDENING MEASURE 1: HIDE SERVER SIGNATURE & INFO
    # ========================================================
    server_tokens off;

    # ========================================================
    # HARDENING MEASURE 2: BUFFER SIZES & ATTACK MITIGATION
    # ========================================================
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # ========================================================
    # HARDENING MEASURE 3: RATE LIMITING (Anti-DDoS / Brute Force)
    # ========================================================
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ========================================================
    # HTTP SERVER (Port 80)
    # Hỗ trợ truy cập cả HTTP và chuyển hướng an toàn sang HTTPS
    # ========================================================
    server {
        listen 80;
        server_name localhost _;

        # Metrics for Prometheus nginx-prometheus-exporter
        location /stub_status {
            stub_status on;
            access_log off;
            allow all;
        }

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================
    # HTTPS REVERSE PROXY SERVER (Port 443)
    # ========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # ========================================================
        # SSL CERTIFICATES & TLS HARDENING
        # ========================================================
        ssl_certificate /etc/nginx/ssl/localhost.crt;
        ssl_certificate_key /etc/nginx/ssl/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ========================================================
        # HARDENING MEASURE 4: SECURITY HEADERS (OWASP Standard)
        # ========================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Apply Rate Limiting
        limit_req zone=req_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        # ----------------------------------------------------
        # 1. Reverse Proxy: Web Application (Portfolio & CMS)
        # ----------------------------------------------------
        location / {
            proxy_pass http://portfolio-web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 90;
        }

        # ----------------------------------------------------
        # 2. Reverse Proxy: phpMyAdmin (Database Tool)
        # ----------------------------------------------------
        location /phpmyadmin/ {
            proxy_pass http://phpmyadmin:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 3. Reverse Proxy: Grafana Dashboards
        # ----------------------------------------------------
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 4. Reverse Proxy: Prometheus
        # ----------------------------------------------------
        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
