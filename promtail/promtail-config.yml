# ========================================================
# PROMTAIL CONFIGURATION
# Môn: Triển khai và Quản trị Hệ thống Phần mềm - Đề tài 13
# ========================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Nginx Logs Scraping
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: reverse-proxy
          __path__: /var/log/nginx/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            remote_addr: remote_addr
            request_method: request_method
            request_uri: request_uri
            status: status
            request_time: request_time
      - labels:
          request_method:
          status:

  # 2. Docker Container Logs Scraping (from Docker Daemon)
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
            tag: attrs.tag
      - regex:
          expression: "^(?P<time>\\S+) (?P<stream>stdout|stderr) (?P<logcontent>.*)$"
      - labels:
          stream:
